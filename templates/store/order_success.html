{% extends 'store/base.html' %}
{% block title %}Order placed | ShopEase{% endblock %}
{% block content %}
<div class="success-card"><div class="success-icon">✓</div><p class="eyebrow">THANK YOU FOR SHOPPING</p><h1>Your order is placed!</h1>
  <p>Order number <strong>#{{ order.id }}</strong></p><p>Total: <strong>₹{{ order.total_amount }}</strong></p><p>Status: {{ order.status }}</p>
  <a class="button" href="{% url 'orders' %}">View my orders</a><a class="text-link" href="{% url 'home' %}">Continue shopping</a></div>
{% endblock %}
